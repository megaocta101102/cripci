<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mat SMA - Masuk Portal Pembelajaran</title>
  <meta name="description" content="Halaman login autentikasi pengguna ke portal Mat SMA Expo City.">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-background">

  <!-- Header Minimal -->
  <header class="login-header">
    <a href="index.html" class="brand-link">
      <span class="brand-mat">Mat</span><span class="brand-sma">SMA</span>
    </a>
  </header>

  <!-- Kontainer Form Login -->
  <main class="login-container">
    <div class="login-card">
      <div class="login-header-group">
        <h1 class="login-title" id="authTitle">LOGIN</h1>
      </div>

      <!-- Mode Switcher: Login / Buat Akun -->
      <div class="auth-mode-toggle">
        <button type="button" class="auth-toggle-btn active" id="tabLoginBtn">Login</button>
        <button type="button" class="auth-toggle-btn" id="tabRegisterBtn">Buat Akun</button>
      </div>

      <!-- FORM 1: LOGIN -->
      <form id="loginForm">
        <div class="form-group">
          <label for="identifierInput" class="form-label">Masukkan email atau Nama lengkap</label>
          <input type="text" id="identifierInput" class="form-input" placeholder="Masukkan email atau nama lengkap..." required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="passwordInput" class="form-input" placeholder="Masukkan password Anda..." required autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" class="btn-toggle-password" aria-label="Lihat atau sembunyikan password" title="Lihat/Sembunyikan Password">
              <!-- Icon Mata Terbuka -->
              <svg id="eyeIconOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Icon Mata Tertutup -->
              <svg id="eyeIconClosed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <div id="loginFeedback" style="display: none; font-size: 0.88rem; margin-bottom: 1.25rem;"></div>

        <!-- Tombol Login -->
        <button type="submit" class="btn-submit" id="btnSubmitLogin">
          Login
        </button>

        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="index.html" class="link-back-underline">
            Kembali ke Beranda
          </a>
        </div>
      </form>

      <!-- FORM 2: BUAT AKUN -->
      <form id="registerForm" style="display: none;">
        <div class="form-group">
          <label for="regEmailInput" class="form-label">Email</label>
          <input type="email" id="regEmailInput" class="form-input" placeholder="Masukkan email..." autocomplete="email">
        </div>

        <div class="form-group">
          <label for="regNameInput" class="form-label">Nama Lengkap</label>
          <input type="text" id="regNameInput" class="form-input" placeholder="Masukkan nama lengkap..." autocomplete="name">
        </div>

        <div class="form-group">
          <label for="regPasswordInput" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="regPasswordInput" class="form-input" placeholder="Masukkan password..." autocomplete="new-password">
            <button type="button" id="toggleRegPasswordBtn" class="btn-toggle-password" aria-label="Lihat atau sembunyikan password" title="Lihat/Sembunyikan Password">
              <svg id="eyeRegIconOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeRegIconClosed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <div id="registerFeedback" style="display: none; font-size: 0.88rem; margin-bottom: 1.25rem;"></div>

        <!-- Tombol Buat Akun -->
        <button type="submit" class="btn-submit" id="btnSubmitRegister">
          Buat Akun
        </button>

        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="index.html" class="link-back-underline">
            Kembali ke Beranda
          </a>
        </div>
      </form>
    </div>
  </main>

  <!-- Scripts: MVC Architecture -->
  <script src="config/env.js"></script>
  <script src="models/SupabaseService.js"></script>
  <script src="models/UserModel.js"></script>
  <script src="controllers/LoginController.js"></script>
</body>
</html>
